version: '3.8'

services:
  feedpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feedpulse-ai
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - DEFAULT_HYBRID_ALPHA=0.55
      # Optional API keys:
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
